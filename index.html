<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corebreaker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #alt{position:fixed;right:12px;bottom:10px;color:#7f93b8;font:14px "Trebuchet MS","Segoe UI",sans-serif}
  canvas{display:block;background:#070914;image-rendering:auto}
</style>
</head>
<body>
<canvas id="c" width="960" height="720"></canvas>
<a id="alt" href="3d.html">3D version</a>
<script src="game.js"></script>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', resize); resize();

// ---------- draw ----------
function glow(c, b) { ctx.shadowColor = c; ctx.shadowBlur = b; }
function drawShip(x, y, a, scale = 1, flame = 0, stretch = 1, squash = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(scale * stretch, scale * squash);
  if (flame > 0) {
    ctx.fillStyle = '#ffb347'; glow('#ff7a2f', 14);
    ctx.beginPath(); ctx.moveTo(-9, -4); ctx.lineTo(-12 - flame * rnd(8, 16), 0); ctx.lineTo(-9, 4); ctx.fill();
  }
  glow('#7fd4ff', 12); ctx.fillStyle = '#0d1a2e'; ctx.strokeStyle = '#cfeaff'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(17, 0); ctx.lineTo(-4, -7); ctx.lineTo(-12, -13); ctx.lineTo(-9, -3);
  ctx.lineTo(-9, 3); ctx.lineTo(-12, 13); ctx.lineTo(-4, 7); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7fd4ff'; ctx.beginPath(); ctx.arc(3, 0, 2.5, 0, TAU); ctx.fill();
  ctx.restore();
}
// A turning globe: the surface map is drawn one pixel column at a time, each column taken from
// the longitude that an orthographic view of a sphere would show there, then shaded.
function drawPlanet(p) {
  const tex = planetTex[p.type], tw = tex.width, th = tex.height, r = p.r, lean = p.tilt * 0.6;
  const turn = time * p.rate / TAU;
  const ringHalf = (a0, a1) => {
    ctx.strokeStyle = 'rgba(218,196,146,0.8)'; ctx.lineWidth = r * 0.26;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.52, r * 0.42, 0, a0, a1); ctx.stroke();
    ctx.strokeStyle = 'rgba(186,162,118,0.6)'; ctx.lineWidth = r * 0.15;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.92, r * 0.53, 0, a0, a1); ctx.stroke();
  };
  ctx.save(); ctx.translate(p.x, p.y); ctx.lineCap = 'butt';
  glow(p.color, 18); ctx.fillStyle = 'rgba(10,14,30,1)';
  ctx.beginPath(); ctx.arc(0, 0, r - 1, 0, TAU); ctx.fill();          // halo behind the globe
  ctx.shadowBlur = 0;
  ctx.rotate(lean);
  if (p.ring) ringHalf(Math.PI, TAU);                                 // far half of the rings
  for (let x = -Math.ceil(r); x < r; x++) {
    const xc = x + 0.5; if (Math.abs(xc) >= r) continue;
    const h = Math.sqrt(r * r - xc * xc), span = Math.asin(h / r) / Math.PI;
    const u = (((Math.asin(xc / r) / TAU - turn) % 1) + 1) % 1;
    ctx.drawImage(tex, Math.min(tw - 1, Math.floor(u * tw)), (0.5 - span) * th, 1, 2 * span * th, x, -h, 1.08, 2 * h);
  }
  ctx.rotate(-lean);
  const g = ctx.createRadialGradient(-r * 0.45, -r * 0.45, r * 0.1, -r * 0.2, -r * 0.2, r * 1.45);
  g.addColorStop(0, 'rgba(255,255,255,0.22)'); g.addColorStop(0.35, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,12,0.85)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r + 0.5, 0, TAU); ctx.fill();   // day side to night side
  if (p.ring) { ctx.rotate(lean); ringHalf(0, Math.PI); }             // near half, over the globe
  ctx.restore(); ctx.lineCap = 'round';
}
function text(s, x, y, size, color = '#cfeaff', align = 'center') {
  ctx.font = '600 ' + size + 'px "Trebuchet MS", "Segoe UI", sans-serif';
  ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function draw() {
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#070914'; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.3 * Math.sin(time * 1.5 + s.p);
    ctx.fillStyle = '#9fb4ff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // space-time fabric: a grid whose lines are dragged toward anything massive
  const src = fabricSources();
  const warped = (x, y, first) => {
    let ox = 0, oy = 0;
    for (const s of src) {
      const dx = s.x - x, dy = s.y - y, w = 0.3 * s.depth / (1 + (dx * dx + dy * dy) / (s.size * s.size));
      ox += dx * w; oy += dy * w;
    }
    if (first) ctx.moveTo(x + ox, y + oy); else ctx.lineTo(x + ox, y + oy);
  };
  ctx.strokeStyle = 'rgba(79,125,255,0.17)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 48) for (let y = 0; y <= H; y += 16) warped(x, y, y === 0);
  for (let y = 0; y <= H; y += 48) for (let x = 0; x <= W; x += 16) warped(x, y, x === 0);
  ctx.stroke();

  if (shells) {
    for (const p of planets) drawPlanet(p);
    // black hole: spinning accretion arcs around a dark disc
    if (hole) {
      const R = HOLE_R * hole.k;
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffb347'; glow('#ff8a2a', 24);
      for (let i = 0; i < 3; i++) {
        const a0 = hole.spin * (4 - i) + i * 2.1;
        ctx.globalAlpha = (0.9 - i * 0.25) * hole.k;
        ctx.beginPath(); ctx.arc(hole.x, hole.y, R + 5 + i * 6, a0, a0 + 3.8); ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(hole.x, hole.y, R, 0, TAU); ctx.fill();
    }
    if (whiteHole) {
      const R = 15 * whiteHole.k;
      glow('#ffffff', 34); ctx.fillStyle = '#f4fbff';
      ctx.beginPath(); ctx.arc(whiteHole.x, whiteHole.y, R, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 2; ctx.globalAlpha = whiteHole.k;
      ctx.beginPath(); ctx.arc(whiteHole.x, whiteHole.y, R + 8 + 3 * Math.sin(time * 30), 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
    // shells
    ctx.lineCap = 'round';
    shells.forEach((s, i) => {
      const step = TAU / s.n, gap = 5 / s.r;
      for (let k = 0; k < s.n; k++) {
        if (s.seg[k] <= 0) continue;
        const a0 = s.rot + k * step + gap, a1 = s.rot + (k + 1) * step - gap;
        glow(PAL[i], s.seg[k] === 2 ? 14 : 4);
        ctx.strokeStyle = PAL[i]; ctx.globalAlpha = s.seg[k] === 2 ? 1 : 0.45;
        ctx.lineWidth = s.seg[k] === 2 ? 7 : 4;
        ctx.beginPath(); ctx.arc(CX, CY, s.r, a0, a1); ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;
    // core
    if (core.alive) {
      const pulse = 1 + 0.08 * Math.sin(time * 5);
      ctx.save(); ctx.translate(CX, CY); ctx.rotate(core.ang);
      glow('#ff4d4d', 20 + core.flash * 20);
      ctx.fillStyle = core.flash > 0.3 ? '#fff2c4' : '#ff6b5a';
      ctx.beginPath();
      for (let k = 0; k < 6; k++) { const a = k * TAU / 6, r = (k % 2 ? 11 : 16) * pulse; ctx[k ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe9a8'; ctx.fillRect(10, -3, 12, 6);
      ctx.restore();
    }
    // bolts
    for (const b of bolts) {
      glow('#ff4d4d', 22); ctx.fillStyle = '#fff2c4';
      ctx.beginPath(); ctx.arc(b.x, b.y, 7 + Math.sin(time * 40) * 1.5, 0, TAU); ctx.fill();
    }
    // drones
    for (const d of drones) {
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.spin);
      glow('#b98cff', 12); ctx.strokeStyle = '#d9c2ff'; ctx.lineWidth = 2;
      ctx.globalAlpha = d.life < 2 ? 0.4 + 0.6 * Math.abs(Math.sin(time * 14)) : 1;
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(7, 5); ctx.lineTo(-7, 5); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // shots
    glow('#7fd4ff', 10); ctx.strokeStyle = '#eaf6ff'; ctx.lineWidth = 3;
    for (const b of shots) { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.018, b.y - b.vy * 0.018); ctx.stroke(); }
    // ship
    if (ship.alive && warp) {      // being pulled thin into the hole, or thrown back out
      if (warp.phase !== 'void') {
        ctx.globalAlpha = warp.alpha; drawShip(ship.x, ship.y, ship.a, 1, 0, warp.stretch, warp.squash); ctx.globalAlpha = 1;
      }
    } else if (ship.alive && (ship.inv <= 0 || Math.floor(time * 12) % 2)) drawShip(ship.x, ship.y, ship.a, 1, ship.flame);
  }
  // particles
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); glow(p.color, 8); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // HUD
  text('SCORE ' + score, 20, 32, 20, '#cfeaff', 'left');
  text('BEST ' + hi, W / 2, 32, 16, '#7f93b8');
  if (state === 'play') {
    text('SECTOR ' + level, W - 20, 32, 20, '#cfeaff', 'right');
    for (let i = 0; i < Math.min(lives - (ship.alive ? 1 : 0), 8); i++) drawShip(30 + i * 28, 58, -Math.PI / 2, 0.6);
    if (clearTimer > 0) text('CORE BREACHED  +' + 1000 * level, CX, CY - 150, 30, '#ffe9a8');
    if (paused) text('PAUSED', CX, CY - 150, 30);
  } else {
    glow('#4fe3d0', 24);
    text('COREBREAKER', CX, 190, 68, '#4fe3d0');
    ctx.shadowBlur = 0;
    if (state === 'over') text('GAME OVER  —  ' + score + ' points', CX, 250, 26, '#ff5fa2');
    const y = 470;
    if (touchOn) {
      text('◀ ▶  rotate      THRUST      FIRE', CX, y + 45, 22);
    } else {
      text('← →  or  A D    rotate', CX, y, 20);
      text('↑  or  W    thrust', CX, y + 30, 20);
      text('SPACE    fire', CX, y + 60, 20);
      text('P    pause', CX, y + 90, 20);
    }
    text('Punch a lane through the spinning shells and hit the core.', CX, y + 140, 17, '#7f93b8');
    text('Strip the whole outer shell and the fortress regrows.', CX, y + 164, 17, '#7f93b8');
    text("The core's gravity pulls you in: coast sideways to orbit and strafe.", CX, y + 188, 17, '#7f93b8');
    text('Planets bend your shots. A black hole spits you out on the far side.', CX, y + 212, 17, '#7f93b8');
    if (Math.floor(time * 2) % 2) text(touchOn ? 'TAP TO LAUNCH' : 'PRESS SPACE TO LAUNCH', CX, 330, 24, '#ffe9a8');
  }
}

startLoop();
</script>
</body>
</html>
